# Increase radio range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Responsive switches without making release chatter overly sensitive.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Keep the nice!view visible while the keyboard is awake.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Uncomment to enable automatic deep sleep.
# CONFIG_ZMK_SLEEP=y
